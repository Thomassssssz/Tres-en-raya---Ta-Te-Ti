<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ta Te Ti con TensorFlow.js</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.0.0/dist/tf.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top, #312e81, transparent 35%),
          linear-gradient(135deg, #020617, #111827, #1e1b4b);
        color: white;
        text-align: center;
        margin: 0;
        min-height: 100vh;
        padding: 30px;
      }

      .contenedor {
        max-width: 570px;
        margin: auto;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 25px;
        padding: 30px;
        box-shadow: 0 0 35px rgba(99, 102, 241, 0.35);
      }

      h1 {
        margin-bottom: 10px;
        font-size: 38px;
        text-shadow: 0 0 15px #6366f1;
      }

      p {
        color: #d1d5db;
        margin-bottom: 5px;
      }

      .subtitulo {
        color: #a5b4fc;
        font-weight: bold;
      }

      #tablero {
        display: grid;
        grid-template-columns: repeat(3, 110px);
        grid-template-rows: repeat(3, 110px);
        gap: 12px;
        justify-content: center;
        margin: 30px auto;
      }

      .celda {
        width: 110px;
        height: 110px;
        font-size: 50px;
        font-weight: bold;
        border: 2px solid rgba(129, 140, 248, 0.4);
        border-radius: 20px;
        background: linear-gradient(145deg, #1e293b, #0f172a);
        color: white;
        cursor: pointer;
        box-shadow:
          inset 0 0 15px rgba(255, 255, 255, 0.04),
          0 8px 20px rgba(0, 0, 0, 0.45);
        transition: 0.2s;
      }

      .celda:hover {
        transform: scale(1.06);
        background: linear-gradient(145deg, #312e81, #1e1b4b);
        box-shadow: 0 0 20px rgba(129, 140, 248, 0.7);
      }

      .x {
        color: #38bdf8;
        text-shadow: 0 0 15px #38bdf8;
      }

      .o {
        color: #f472b6;
        text-shadow: 0 0 15px #f472b6;
      }

      #mensaje {
        font-size: 19px;
        margin-top: 15px;
        font-weight: bold;
        min-height: 48px;
        color: #facc15;
      }

      .botones {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      button.accion {
        padding: 13px 22px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 14px;
        color: white;
        cursor: pointer;
        transition: 0.2s;
      }

      #reiniciar {
        background: linear-gradient(135deg, #6366f1, #ec4899);
        box-shadow: 0 0 18px rgba(236, 72, 153, 0.45);
      }

      #reiniciar:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(236, 72, 153, 0.75);
      }

      #borrarAprendizaje {
        background: linear-gradient(135deg, #ef4444, #f97316);
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.35);
      }

      #borrarAprendizaje:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(249, 115, 22, 0.65);
      }

      .info {
        margin-top: 20px;
        font-size: 14px;
        color: #cbd5e1;
        background: rgba(30, 41, 59, 0.65);
        padding: 12px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .footer {
        margin-top: 18px;
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="contenedor">
      <h1>TA-TE-TI IA</h1>
      <p class="subtitulo">TensorFlow.js + aprendizaje por partida</p>
      <p>Jugador humano: <b>X</b> | Inteligencia artificial: <b>O</b></p>

      <div id="tablero"></div>

      <div id="mensaje">Cargando modelo...</div>

      <div class="botones">
        <button id="reiniciar" class="accion">Reiniciar juego</button>
        <button id="borrarAprendizaje" class="accion">
          Borrar aprendizaje
        </button>
      </div>

      <div class="info" id="infoAprendizaje">
        Partidas aprendidas por el modelo: 0
      </div>

      <div class="footer">
        TensorFlow.js • Modelo Sequential • Dense Layers • Softmax • model.fit()
      </div>
    </div>

    <script>
      let modelo;

      /*
        Representación del tablero según el modelo:

        -1 = X jugador humano
         0 = casilla vacía
         1 = O inteligencia artificial
      */
      let tablero = [0, 0, 0, 0, 0, 0, 0, 0, 0];

      let juegoTerminado = false;

      /*
        Guarda las jugadas que hizo la IA durante una partida.
        Después se usa para entrenar el modelo.
      */
      let historialIA = [];

      let partidasAprendidas =
        Number(localStorage.getItem("partidasAprendidas")) || 0;

      const contenedorTablero = document.getElementById("tablero");
      const mensaje = document.getElementById("mensaje");
      const botonReiniciar = document.getElementById("reiniciar");
      const botonBorrarAprendizaje =
        document.getElementById("borrarAprendizaje");
      const infoAprendizaje = document.getElementById("infoAprendizaje");

      const descansosIA = [
        "Te gané, máquina. Andá practicando porque así no llegás ni al recreo 😎",
        "Perdiste contra un archivo .bin, hermano. Durísimo lo tuyo 😭",
        "Te gané caminando. La próxima avisá y juego sin procesador 😂",
        "Mamita querida... ni el tutorial te salva de esta 🤦‍♂️",
        "Te gané con TensorFlow, pero podría haberte ganado con una calculadora Casio 🧠",
        "No fue Ta-Te-Ti, fue trámite administrativo. Siguiente 📝",
        "Te leí la jugada antes de que vos la pensaras, crack 👀",
        "Te gané y todavía me sobró RAM. Qué momento 💀",
        "Esa jugada fue más floja que mate lavado 🧉",
        "Ganó la máquina. El humano quedó en mantenimiento 🔧",
        "Qué hiciste, hermano... esa jugada pedía auxilio 🚑",
        "Te comiste una derrota tamaño familiar 🍕",
        "Mamadera, esa defensa estaba más abierta que kiosco 24 horas 🏪",
        "Te mandé al lobby, campeón 🎮",
        "La próxima pensá dos veces. O una, para empezar 🧠",
      ];

      actualizarInfoAprendizaje();

      async function cargarModelo() {
        try {
          /*
            Primero intenta cargar el modelo ya entrenado por partidas anteriores.
          */
          modelo = await tf.loadLayersModel(
            "localstorage://modelo-ta-te-ti-aprendido",
          );
          mensaje.textContent = "Modelo aprendido cargado. Tu turno.";
          console.log("Modelo aprendido cargado desde el navegador.");
        } catch (error) {
          /*
            Si no existe un modelo aprendido, carga el modelo original del profe.
          */
          modelo = await tf.loadLayersModel("model/ttt_model.json");
          mensaje.textContent = "Modelo original cargado. Tu turno.";
          console.log("Modelo original cargado desde la carpeta model.");
        }

        /*
          Se compila para poder entrenar con model.fit().
        */
        modelo.compile({
          optimizer: tf.train.adam(0.01),
          loss: "categoricalCrossentropy",
          metrics: ["accuracy"],
        });

        dibujarTablero();
      }

      function dibujarTablero() {
        contenedorTablero.innerHTML = "";

        for (let i = 0; i < tablero.length; i++) {
          const boton = document.createElement("button");
          boton.className = "celda";

          if (tablero[i] === -1) {
            boton.textContent = "X";
            boton.classList.add("x");
          } else if (tablero[i] === 1) {
            boton.textContent = "O";
            boton.classList.add("o");
          } else {
            boton.textContent = "";
          }

          boton.addEventListener("click", function () {
            jugarHumano(i);
          });

          contenedorTablero.appendChild(boton);
        }
      }

      function jugarHumano(posicion) {
        if (juegoTerminado) return;

        if (tablero[posicion] !== 0) {
          mensaje.textContent = "Esa casilla ya está ocupada, pillín.";
          return;
        }

        tablero[posicion] = -1;
        dibujarTablero();

        if (verificarGanador(-1)) {
          mensaje.textContent =
            "Ganaste vos. La IA va a aprender de esta derrota 😳";

          juegoTerminado = true;
          entrenarConPartida("ganoHumano");
          return;
        }

        if (tableroLleno()) {
          mensaje.textContent =
            "Empate. La IA guarda esta partida para mejorar 🧠";

          juegoTerminado = true;
          entrenarConPartida("empate");
          return;
        }

        mensaje.textContent = "Turno de la inteligencia artificial...";

        setTimeout(jugarIA, 500);
      }

      function jugarIA() {
        if (juegoTerminado) return;

        if (!modelo) {
          mensaje.textContent = "La IA todavía no cargó el modelo.";
          return;
        }

        /*
          Guardamos cómo estaba el tablero antes de que la IA juegue.
        */
        const estadoAntesDeJugar = [...tablero];

        /*
          La IA usa el modelo del profe para elegir.
        */
        const movimiento = predecirMejorMovimiento();

        if (movimiento === -1) {
          mensaje.textContent = "La IA no encontró jugada válida.";
          return;
        }

        /*
          Guardamos esa jugada para aprender al final de la partida.
        */
        historialIA.push({
          estado: estadoAntesDeJugar,
          movimiento: movimiento,
        });

        tablero[movimiento] = 1;
        dibujarTablero();

        if (verificarGanador(1)) {
          mensaje.textContent = obtenerDescansoIA();

          juegoTerminado = true;
          entrenarConPartida("ganoIA");
          return;
        }

        if (tableroLleno()) {
          mensaje.textContent =
            "Empate. No ganaste, pero sobreviviste. Algo es algo 🧉";

          juegoTerminado = true;
          entrenarConPartida("empate");
          return;
        }

        mensaje.textContent = "Tu turno. Pensalo bien, la IA está mirando 👀";
      }

      function predecirMejorMovimiento() {
        /*
          Acá NO usamos minimax.
          Acá NO usamos memoria externa.
          Acá decide el modelo con model.predict().
        */
        return tf.tidy(function () {
          const entrada = tf.tensor([tablero]);

          const prediccion = modelo.predict(entrada);
          const probabilidades = prediccion.dataSync();

          /*
            Pequeña exploración:
            durante las primeras partidas, a veces prueba otra jugada válida.
            Esto ayuda a que pueda aprender y no repita siempre lo mismo.
          */
          const jugadasDisponibles = obtenerJugadasDisponibles(tablero);

          let probabilidadExplorar = 0.25;

          if (partidasAprendidas >= 10) {
            probabilidadExplorar = 0.15;
          }

          if (partidasAprendidas >= 25) {
            probabilidadExplorar = 0.08;
          }

          if (partidasAprendidas >= 50) {
            probabilidadExplorar = 0.03;
          }

          if (Math.random() < probabilidadExplorar) {
            const aleatorio = Math.floor(
              Math.random() * jugadasDisponibles.length,
            );
            return jugadasDisponibles[aleatorio];
          }

          let mejorPosicion = -1;
          let mejorValor = -999;

          for (let i = 0; i < probabilidades.length; i++) {
            if (tablero[i] === 0 && probabilidades[i] > mejorValor) {
              mejorValor = probabilidades[i];
              mejorPosicion = i;
            }
          }

          return mejorPosicion;
        });
      }

      async function entrenarConPartida(resultado) {
        if (historialIA.length === 0) return;

        const entradas = [];
        const salidas = [];

        for (let i = 0; i < historialIA.length; i++) {
          const jugada = historialIA[i];

          entradas.push(jugada.estado);

          const salida = crearSalidaEsperada(
            jugada.estado,
            jugada.movimiento,
            resultado,
          );

          salidas.push(salida);
        }

        const xs = tf.tensor2d(entradas);
        const ys = tf.tensor2d(salidas);

        const mensajeAnterior = mensaje.textContent;
        mensaje.textContent = mensajeAnterior + " | Entrenando modelo... 🧠";

        /*
          Acá aprende de verdad:
          model.fit() ajusta los pesos internos del modelo.
        */
        await modelo.fit(xs, ys, {
          epochs: 35,
          shuffle: true,
        });

        /*
          Se guarda el modelo aprendido en el navegador.
        */
        await modelo.save("localstorage://modelo-ta-te-ti-aprendido");

        xs.dispose();
        ys.dispose();

        historialIA = [];

        partidasAprendidas++;
        localStorage.setItem("partidasAprendidas", partidasAprendidas);

        actualizarInfoAprendizaje();

        mensaje.textContent =
          mensajeAnterior + " | La IA aprendió de esta partida 🧠🔥";
      }

      function crearSalidaEsperada(estado, movimientoIA, resultado) {
        /*
          El modelo tiene 9 salidas, una por cada casilla.
          Esta función arma qué debería aprender después de cada partida.
        */
        const salida = [0, 0, 0, 0, 0, 0, 0, 0, 0];

        const vacias = [];

        for (let i = 0; i < estado.length; i++) {
          if (estado[i] === 0) {
            vacias.push(i);
          }
        }

        if (resultado === "ganoIA") {
          /*
            Si la IA ganó, reforzamos la jugada que eligió.
          */
          salida[movimientoIA] = 1;
        }

        if (resultado === "empate") {
          /*
            Si empató, reforzamos la jugada,
            pero un poco menos que una victoria.
          */
          salida[movimientoIA] = 0.8;

          const otras = vacias.filter(function (posicion) {
            return posicion !== movimientoIA;
          });

          const resto = 0.2 / Math.max(otras.length, 1);

          for (let i = 0; i < otras.length; i++) {
            salida[otras[i]] = resto;
          }
        }

        if (resultado === "ganoHumano") {
          /*
            Si perdió la IA, no reforzamos esa jugada.
            Repartimos el aprendizaje entre las otras casillas vacías.
            Así el modelo empieza a bajar la preferencia por la jugada mala.
          */
          const alternativas = vacias.filter(function (posicion) {
            return posicion !== movimientoIA;
          });

          if (alternativas.length > 0) {
            const valor = 1 / alternativas.length;

            for (let i = 0; i < alternativas.length; i++) {
              salida[alternativas[i]] = valor;
            }
          } else {
            salida[movimientoIA] = 0.1;
          }
        }

        return salida;
      }

      function obtenerJugadasDisponibles(tableroActual) {
        const jugadas = [];

        for (let i = 0; i < tableroActual.length; i++) {
          if (tableroActual[i] === 0) {
            jugadas.push(i);
          }
        }

        return jugadas;
      }

      function verificarGanador(jugador) {
        const combinaciones = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];

        for (let i = 0; i < combinaciones.length; i++) {
          const a = combinaciones[i][0];
          const b = combinaciones[i][1];
          const c = combinaciones[i][2];

          if (
            tablero[a] === jugador &&
            tablero[b] === jugador &&
            tablero[c] === jugador
          ) {
            return true;
          }
        }

        return false;
      }

      function tableroLleno() {
        return !tablero.includes(0);
      }

      function obtenerDescansoIA() {
        const posicion = Math.floor(Math.random() * descansosIA.length);
        return descansosIA[posicion];
      }

      function reiniciarJuego() {
        tablero = [0, 0, 0, 0, 0, 0, 0, 0, 0];

        juegoTerminado = false;
        historialIA = [];

        mensaje.textContent = "Tu turno. Elegí una casilla.";
        dibujarTablero();
      }

      async function borrarAprendizaje() {
        try {
          await tf.io.removeModel("localstorage://modelo-ta-te-ti-aprendido");
        } catch (error) {
          console.log("No había modelo aprendido guardado.");
        }

        partidasAprendidas = 0;
        localStorage.setItem("partidasAprendidas", partidasAprendidas);

        historialIA = [];

        modelo = await tf.loadLayersModel("model/ttt_model.json");

        modelo.compile({
          optimizer: tf.train.adam(0.01),
          loss: "categoricalCrossentropy",
          metrics: ["accuracy"],
        });

        actualizarInfoAprendizaje();

        mensaje.textContent = "Aprendizaje borrado. Modelo original cargado.";

        reiniciarJuego();
      }

      function actualizarInfoAprendizaje() {
        infoAprendizaje.textContent =
          "Partidas aprendidas por el modelo: " + partidasAprendidas;
      }

      botonReiniciar.addEventListener("click", reiniciarJuego);
      botonBorrarAprendizaje.addEventListener("click", borrarAprendizaje);

      cargarModelo();
    </script>
  </body>
</html>
